[project]
name = "lake-cli"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lake-core", "lake-ingest", "lake-server", "lake-processors", "lake-parsers", "uvicorn"]

[project.scripts]
lake = "lake_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_cli"]
