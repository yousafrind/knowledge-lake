[project]
name = "lake-server"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lake-core", "lake-retrieval", "lake-ingest", "mcp", "uvicorn", "jinja2", "itsdangerous", "markdown-it-py", "python-multipart"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_server"]
