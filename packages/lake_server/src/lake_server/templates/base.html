<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{% block title %}Knowledge Lake{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:60rem;margin:0 auto;padding:1rem;color:#1a1a1a}
nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ddd;padding-bottom:.5rem;margin-bottom:1rem}
nav form{margin-left:auto}input[type=text],input[type=password]{padding:.35rem;min-width:16rem}
.muted{color:#666;font-size:.9rem}.hit{margin:1rem 0;padding:.5rem 0;border-bottom:1px solid #eee}
pre,code{background:#f5f5f5}pre{padding:.5rem;overflow:auto}.layout{display:flex;gap:2rem}
aside{min-width:14rem;font-size:.9rem}main{flex:1;min-width:0}
</style></head><body>
<nav><a href="/">Browse</a> <a href="/new">New note</a> <a href="/review">Review</a> <a href="/jobs">Sources &amp; jobs</a>
<form action="/search" method="get"><input type="text" name="q" value="{{ q|default('') }}" placeholder="Search the lake"> <button>Search</button></form>
<form action="/logout" method="post"><button>Log out</button></form></nav>
{% block body %}{% endblock %}
</body></html>
