[project]
name = "lake-core"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2", "psycopg[binary]>=3", "alembic", "pydantic-settings>=2", "boto3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_core"]
