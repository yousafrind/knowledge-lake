[project]
name = "lake-ingest"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lake-core", "httpx", "beautifulsoup4", "markdownify", "pathspec", "magika"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_ingest"]
